# /etc/nginx/sites-available/repka.school
# Symlink to /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Goal: serve repka.school via TLS, proxy /api/ and /uploads/ to the backend
# container (127.0.0.1:8086), everything else to Next.js (127.0.0.1:3006).
# Compatible with a parallel abuzhuma.com vhost on the same nginx — rate-limit
# zones and upstream names are repka-namespaced.

upstream repka_backend {
    server 127.0.0.1:8086;
    keepalive 32;
}

upstream repka_frontend {
    server 127.0.0.1:3006;
    keepalive 32;
}

# Rate-limit zones — each project must use unique zone names.
limit_req_zone $binary_remote_addr zone=repka_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=repka_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=repka_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# HTTP → HTTPS redirect (certbot will populate the cert paths). Keep ACME path open.
server {
    listen 80;
    listen [::]:80;
    server_name repka.school www.repka.school;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://repka.school$request_uri;
    }
}

# Canonical https://repka.school
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name repka.school;

    ssl_certificate     /etc/letsencrypt/live/repka.school/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repka.school/privkey.pem;
    ssl_session_cache shared:repka_ssl:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 25m;       # tutor uploads (photos, documents)
    limit_conn repka_conn 20;

    # ---------------- API: high-throughput, cacheable
    location /api/ {
        limit_req zone=repka_api burst=40 nodelay;

        proxy_pass http://repka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Auth endpoints — stricter, plus deny replay-able patterns.
    location ~ ^/api/(auth/(login|register|forgot-password|reset-password)) {
        limit_req zone=repka_auth burst=10 nodelay;

        proxy_pass http://repka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # User uploads (tutor photos, docs) served from backend's volume.
    location /uploads/ {
        proxy_pass http://repka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint left open (no rate limit) for monitors.
    location = /health {
        proxy_pass http://repka_backend;
        access_log off;
    }

    # ---------------- Next.js: SSR + static
    location /_next/static/ {
        proxy_pass http://repka_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://repka_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.repka.school;

    ssl_certificate     /etc/letsencrypt/live/repka.school/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repka.school/privkey.pem;

    return 301 https://repka.school$request_uri;
}
